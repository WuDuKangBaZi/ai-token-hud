[package]
name = "ai-token-hud"
version = "0.2.3"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "5.0"
eframe = "0.30"
notify = "8.2.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
zstd = "0.14.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Networking_WinHttp"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
